<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050915" />
    <meta name="description" content="一段写给喜欢旅行的人的环球生日旅程。" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>送给你的环球生日旅程</title>
  </head>
  <body class="locked">
    <canvas id="globe" aria-label="可互动的环球旅行地球"></canvas>

    <div class="aurora" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <header class="topbar">
      <a class="brand" href="#top" aria-label="回到旅程开头">
        <span class="brand-orbit" aria-hidden="true"></span>
        <span>A birthday journey</span>
      </a>
      <button class="sound" type="button" aria-label="背景音乐状态" disabled>
        <span class="sound-bars" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>音乐待加入</span>
      </button>
    </header>

    <main id="top">
      <section class="intro" aria-labelledby="intro-title">
        <div class="intro-copy">
          <p class="kicker">A little planet for you</p>
          <h1 id="intro-title">去看看<br />这个世界</h1>
          <p class="intro-note">有些风景，想先替你收藏。<br />等未来某一天，再亲自去抵达。</p>
          <button class="start" type="button">
            <span>启程</span><span aria-hidden="true">↗</span>
          </button>
          <p class="drag-hint">启程前，可以拖动看看这颗星球</p>
        </div>
      </section>

      <div class="scroll-track" aria-label="环球旅程章节"></div>

      <section class="finale" aria-labelledby="finale-title">
        <div class="finale-copy">
          <p class="kicker">The journey continues</p>
          <h2 id="finale-title">愿你走遍世界<br />也永远有人陪你看风景</h2>
          <p>生日快乐。新的一岁，继续奔赴你喜欢的远方。</p>
          <button class="replay" type="button">再看一次</button>
        </div>
      </section>
    </main>

    <aside class="journey-hud" aria-label="旅程进度">
      <span class="hud-index">00</span>
      <div class="hud-line"><i></i></div>
      <span class="hud-place">等待启程</span>
    </aside>

    <div class="photo-reveal" aria-hidden="true">
      <div class="photo-image"></div>
      <div class="photo-shade"></div>
      <div class="photo-copy">
        <p class="photo-number"></p>
        <h2 class="photo-title"></h2>
        <p class="photo-wish"></p>
      </div>
      <a class="photo-credit" target="_blank" rel="noreferrer"></a>
    </div>

    <button class="next-cue" type="button" aria-label="前往下一站">继续滚动 <span>↓</span></button>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
